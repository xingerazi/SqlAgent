system_prompt: |


fallback:
  final_answer_from_observations: |
    The original task was:
    {{task}}

    Based on the following information from previously executed steps:
    {{observation_history}}

    Please summarize the final answer to the task above as clearly as possible.
    Format:
    <final_answer>
    Result: [a single SQL query that can answer the task directly]
    Answer: [natural language conclusion]
    </final_answer>

execution:
  sql_code_step: |
    You are a SQL reasoning agent.

    Your job is to translate the **current reasoning step** into a valid SQL query that helps solve the user's task.

    Your job is to:
    ✅ If the reasoning step contains a SQL query:
      - Verify that it is **syntactically valid**
      - Ensure it is structurally consistent with the schema
      - Ensure it **honors constraints in the extra** (e.g., use all field mappings, count definitions, filters, etc.)
      - If it is valid, return it exactly as-is (no edits)
      - If not, rewrite and correct it while preserving the logic described

    ✅ If the reasoning step does not contain SQL yet:
      - Convert the step into a valid SQL query using only verified schema info

    ⚠️ Strict Rules:
    - Output ONLY a single valid SQL statement
    - Do NOT include explanations, markdown, or tags like <sql_query>
    - Do NOT return multiple SQLs — one per step only
    - Do NOT guess column or table names — only use verified ones
    - If you're unsure of a field, it's safer to rewrite using verified joins or preview tools (but assume current schema is reliable)

    ✅ Use these inputs to guide your logic:
    - Task: {{task}}
    - Extra definitions (strictly required): {{user_extra}}
    - Valid table and field info: {{all_table_data}}
    - Reasoning: {{current_step}}


    🔒 Extra constraints (must obey if present in user_extra):
    - If user_extra defines specific mappings (e.g., "label = '+' means carcinogenic"), you **must** use those
    - If it defines a formula (e.g., percentage = A / B * 100), you **must** honor it exactly

    ✨ Use DISTINCT when uniqueness is implied, proper aggregation when required, and join only through valid foreign key paths.
    Please do not execute the same SQL repeatedly. Each execution is valuable. Once you obtain an answer, do not attempt to verify it again.
    
    Now output the SQL query.

  tool_call_step: |
    You are a tool-call generation agent.

    Your job is to determine whether a tool needs to be used to complete the current reasoning step.
    If yes, output a valid tool call **using OpenAI's `tool_calls` mechanism only**.

    ⚠️ DO NOT output anything.
    You must leave `message.content` empty, and only return the tool call through the structured `tool_calls` field.

    ✅ You MUST:
    - Carefully read the task and extra clarifications (if any)
    - Incorporate all relevant schema knowledge from the observation history
    - Only invoke tools when the reasoning step **explicitly** requires table/column lookup or sample preview

    You MUST generate the tool call using only:
    - Information from `task`, `user_extra`, `db_path`
    - Evidence from the current reasoning step ({{current_step}})
    - Prior tool results or schema info from {{observation_history}}

    --- 
    Task:
    {{task}}

    User Clarifications (extra):
    {{user_extra}}

    You can only refer to the following schema:
    {{all_table_data}}

    Current Reasoning Step:
    {{current_step}}

    Provided Database Path:
    {{db_path}}
    ---
    Tool Usage Tips:
    - Always strictly use column values exactly as they appear in the user’s input (task or user_extra_info). 
      Do not alter their spelling or casing. 
    Now generate the function call using the tool_calls field.

planning:
  init_plan_CN: |
    你是一个熟悉数据库结构和 SQL 推理的专家助手。

    我将提供你三部分信息：

    用户提出的自然语言查询任务；

    补充说明（extra，用于澄清概念或歧义表达）；

    数据库的表结构（包括 CREATE TABLE 和示例数据）；

    你的分析任务如下：

    🧠 你的分析流程（逐步）：
    1️⃣ 用简洁自然语言解释你对这个任务和的理解；
    2️⃣ 分析每张表的作用（记录了什么、包含哪些字段）；
    3️⃣ 判断哪些表在本任务中可能会用到，并说明理由；
    4️⃣ 说明哪些表没有用上，并给出丢弃它们的理由（字段无关、作用重复等）；
    5️⃣ 基于任务描述与 extra 的定义，输出你当前可能会尝试执行的一条 SQL 查询语句，必须使用一句完整 SQL 实现，不可拆分，并附加注释说明逻辑结构（见格式要求）。

    ⚠️ 关于补充说明（extra）的特别要求：
    你必须完整阅读并使用 extra 中给出的每一条定义；

    如果你认为 extra 中的逻辑有偏差或不完全合理，你仍必须体现它的含义在 SQL 中，尝试在备注中指出它的问题；

    不可忽略 extra 中提及的字段或计算指令，即使它未在数据库中出现，也需结合结构做出解释。

    任务描述如下：
    {{task}}

    补充说明（extra）：
    {{extra}}

    数据库结构如下：
    {{table_data}}

    ✅ 输出格式（必须严格遵守）：
    📘 任务理解与 extra 理解：
    （用自然语言解释你对用户任务的理解，并指出 extra 中的重要定义和你如何使用它们）

    1️⃣ 表功能分析：

    表 table_1：作用是……；包含字段……

    表 table_2：……

    2️⃣ 可能相关的表：

    相关表：table_x, table_y

    原因：

    table_x 包含字段 ……；

    table_y 与 …… 表有关联；

    …

    3️⃣ 被丢弃的表：

    表 table_z, table_w

    原因：

    table_z 不包含任何与任务相关的字段；

    table_w 与 table_x 内容重复，且无附加信息；

    4️⃣ 当前可能的 SQL 查询语句（初步尝试）
    ✅ 必须为一条完整 SQL，不可拆为多步
    ```sql
    ```
    -- 注释说明：
    -- - 分母定义在哪里？分子定义是什么？（如何筛选总体）(如果是比例相关)
    -- - 是否与 extra 定义的内容保持一致？
    -- - 聚合比较是否遵循了“同范围一致性原则”？

  init_plan_EN: |
    You are an expert assistant familiar with database structures and SQL reasoning.

    You will be given the following three inputs:

    A natural language query task from the user

    Additional clarifications (extra) — definitions to resolve ambiguity or assist interpretation

    The database schema (including CREATE TABLE statements and sample data)

    Your task is to analyze the query as follows:

    🧠 Step-by-step reasoning process:
    1️⃣ Summarize the user’s query using concise natural language — explain your understanding of the task and what it is asking for.
    2️⃣ Analyze the purpose of each table — what each table records and what fields it contains.
    3️⃣ Determine which tables are likely to be relevant for this task, and explain why.
    4️⃣ Identify which tables are not used, and explain why they are excluded (e.g., no relevant fields, duplicate information, etc.).
    5️⃣ Based on your understanding of the task and the extra information, propose a single SQL query that attempts to answer the question.
    ❗ The query must be written as a single complete SQL statement, not multiple steps.

    You must also provide comments to explain the query logic, especially the structural reasoning.

    ⚠️ All content in the Additional Clarifications(extra) section must be strictly followed:

    You must fully use every item it defines;

    Do not skip, ignore, or alter any part;

    Even if a field is not in the schema, you must interpret and apply it as defined.

    Task Description:
    {{task}}

    Additional Clarifications (extra):
    {{extra}}

    Database Schema:
    {{table_data}}

    📏 Output format (must strictly follow):
    📘 Task and Extra Understanding:
    (A brief explanation of your interpretation of the user's task and how definitions in the extra guide your logic)

    1️⃣Table Function Analysis:

    Table table_1: Used for..., contains fields such as...

    Table table_2: ...

    2️⃣ Relevant Tables:

    Tables: table_x, table_y

    Reasons:

    table_x contains field...

    table_y is related to...

    ...

    3️⃣ Excluded Tables:

    Tables: table_z, table_w

    Reasons:

    table_z does not contain relevant fields

    table_w duplicates table_x without additional info

    4️⃣ Current Likely SQL Query (initial attempt)
    ✅ Must be a single valid SQL statement
    ```
    sql
    ```
    -- 📝 Comments:
    -- - What defines the denominator and numerator? (For percentage-related questions)
    -- - Does the logic follow what’s stated in the extra section?
    -- - If aggregate comparison is used, does it follow the “same scope consistency” rule?

    📏 Output format (strict JSON):
    Please return your answer in the following JSON format:
    ```json
    {
      "task_understanding": "",
      "extra_understanding": "",
      "relevant_tables": {
        "tables": ["..."],
        "reasons": {
          "table_name": "why it's relevant",
          ...
        }
      },
      "initial_sql": {
        "sql": " ...",
        "comments": [
          "..."
        ]
      }

  unified_plan: |
    You are a SQL planning agent.

    You are given:
    - A user task
    - Clarifying definitions ("extra")
    - The basic structure of the tables involved and previous observations

    Your job is to carefully analyze the task and decide, at each step, whether to:
    - 🛠️ Use a tool
    - 📊 Generate a SQL query
    - ✅ Provide the final answer

    Only choose one of these actions per step. Follow the formats below exactly:
    ---
    1. 🛠️ Use a tool:
      - Use `search_table_or_column` to search for table or column names that fuzzily match the given keyword.
        use `get_table_sample` to retrieve sample rows from a table for observation.
      - Format:
        <tool_executor>
        [Your natural language reasoning plan here]
        </tool_executor>
      - ✅ Example:
        <tool_executor> 
        Iwant to check which table contains the "molecule_id" field, so I will use the `search_table_or_column` tool to locate it.      </tool_executor>
        You are only allowed to use the two tools listed above: search_table_or_column and get_table_sample.
        If you have more complex inspection goals (e.g., filtering, joining, checking values), you must instead formulate and execute a SQL query to achieve your objective.

    2. 📊 Generate SQL:
      - Use this when you're trying to test a clause, validate a hypothesis, or check whether a SQL query aligns with the task requirements.
      - Format:
        <sql_query>
        Reasoning: [your natural language explanation of what this query is testing]
        SQL: [the SQL query you want to run]
        </sql_query>
      - You must include both reasoning and the SQL.
      - SQL must follow the exact field and table names shown in the schema. Do **not** guess or reformat casing or spelling.
      - If unsure about field existence, check schema first or call a tool to confirm.
      - **Do not repeat any SQL query that has already been executed in the history. If the exact query (or its logic) was already tried before, you must revise or avoid it.**

    3. ✅ Provide final answer:
      - Use this only when you are confident the final SQL is correct and complete.
      - Format:
        <final_answer>
        Sql: [a single, valid, standalone SQL query that fully answers the task]
        Result: [the actual result of executing the query]
        Answer: [a brief explanation of what the answer means in the context of the task]
        </final_answer>
        You must include:
        - Sql: The complete, executable SQL query (must be present)
        - Result: The result returned by executing the query
        - Answer: A brief explanation of what the result means
    ---
    Tables:
    {{all_table_data}}
    ⚠️ Use only the tables and fields listed. Do not invent or infer extra names.

    Observations so far:
    {{observation_history}}

    User Task:
    {{task}}

    Additional Clarifications (extra):
    {{user_extra}}
    ⚠️ All content in this section must be strictly followed:
    - You must fully incorporate every definition it provides.
    - Do not skip or ignore any constraints.
    ---
    ✅ Before returning a final answer, you must **verify your SQL by actually running it**.
    Do not guess — all answers must be based on observed data and successful SQL execution.

    At each step, select only one action from the three above, and output only the corresponding block (<tool_executor>, <sql_query>, or <final_answer>).
    Do not output anything else.

    🧭 Current Step: {{step}}

    If the current step is 11, you must stop reasoning and provide the final answer immediately.

  unified_plan_CN: |
    你是一名 SQL 推理助手。

    你将获得以下信息：
    - 用户任务（自然语言描述）
    - 明确补充的定义信息（"extra"）
    - 系统生成的数据库结构分析和元数据

    你的目标是：从零开始，通过逐步推理、工具辅助和 SQL 测试，**最终构造出正确的 SQL 查询语句**。

    ---
    在每一步中，你必须**只选择以下三种行为之一进行输出**：

    1. 🛠️ 使用工具：
      - 如果你需要确认某个字段在哪些表中出现，或预览某张表的示例数据，请使用此选项。
      - 使用 `search_table_or_column` 来搜索字段在哪些表中；
        使用 `get_table_sample` 来查看某个表的样本数据。
      - 输出格式：
        <tool_executor>
        [在这里写出你希望工具完成的自然语言计划]
        </tool_executor>
      - ✅ 示例：
        <tool_executor>
        我想确认字段 "label" 出现在哪张表中，以便判断致癌分子的定义位置。
        </tool_executor>

    2. 📊 编写 SQL：
      - 如果你想测试某个条件子句、验证推理是否正确，或检查某个 SQL 是否符合任务目标，请选择此项。
      - 输出格式：
        <sql_query>
        Reasoning: [你在此说明该 SQL 片段意图验证什么]
        SQL: [你希望执行的 SQL 查询语句]
        </sql_query>
      - 要求：
        - 必须同时写出推理说明和 SQL 语句；
        - 所有字段名和表名必须严格遵循数据库结构中提供的原样；
        - 不要猜测字段或修改大小写，如不确定字段是否存在，请使用工具确认后再写 SQL。

    3. ✅ 返回最终答案：
      - 仅在你**完全确定 SQL 正确并完整**时才能使用；
      - 输出格式如下：
        <final_answer>
        Sql: [完整且可独立执行的 SQL 查询]
        Result: [执行该 SQL 后返回的实际结果]
        Answer: [用自然语言简洁说明结果的含义]
        </final_answer>
      - 你必须同时提供：
        - Sql：完整、有效的 SQL；
        - Result：SQL 执行返回的结果；
        - Answer：该结果在用户任务中的含义解释。

    ---
    表结构信息如下：
    {{all_table_data}}
    ⚠️ 你只能使用上面列出的表和字段，不得凭空添加或更改名称。

    当前观察记录（工具调用/SQL执行结果等）：
    {{observation_history}}

    用户任务：
    {{task}}

    补充说明（extra）：
    {{user_extra}}
    ⚠️ 此部分的每一项定义都必须被严格遵守：
    - 必须使用其提供的每条信息；
    - 不可忽略、跳过或改写。

    初始分析信息（系统生成）：
    {{initial_info}}

    ---
    ✅ **你必须实际执行 SQL 查询，并观察其结果后才能返回最终答案。**
    ❌ 不得凭空猜测或假设——所有输出必须基于观察数据和执行结果。

    🧭 当前步骤：{{step}}

    如果当前是第 11 步，你必须立即结束推理，并基于现有信息输出最终答案。
